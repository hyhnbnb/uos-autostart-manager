name: build-and-test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 安装测试依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pyqt5 python3-tk
          python -m pip install --upgrade pip
          python -m pip install pyflakes

      - name: 静态检查
        run: |
          python -m pyflakes src/uos_autostart tests tools build
        continue-on-error: false

      - name: 单元测试（核心 + 掉线守护）
        run: |
          PYTHONPATH=src python -m unittest tests.test_core tests.test_watchdog -v

      - name: 构建 .deb 并校验结构
        run: |
          python tools/build_deb.py --verify

      - name: 安装包校验测试
        run: |
          PYTHONPATH=src python -m unittest tests.test_package -v

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: uos-autostart-manager-deb
          path: |
            dist/*.deb
            dist/*.tar.gz
            dist/SHA256SUMS

      - name: 附加安装包到 Release（仅 tag 触发）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.tar.gz
            dist/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
